[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; 先等 php-fpm 接受連線才啟動 nginx，冷啟動時 nginx 不會比 php-fpm 先開始接請求
; （#91，理由與等待上限見 docker/wait-for-php-fpm.sh）。
[program:nginx]
command=/usr/local/bin/wait-for-php-fpm.sh nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
