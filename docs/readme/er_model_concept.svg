<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 650" width="838" height="650" role="img">
  <!-- 概念圖：只畫三個基礎類別，加上類別之間的基礎關聯，每條線標一個動詞（述詞）。
       子類（Scope）與述詞子類型不畫在圖上，列在 README 的「Scope」「Relation」兩節的表格。
       依據：origin/develop（7c678d5），2026-11-24。基礎關聯取自 RelationSeeder 每組類號的第一筆
       （子類號 00）：specs／specifiedBy、documents／documentedBy、uses／usedBy、
       requires／isRequiredBy、descendantOf／ancestorOf。
       字級：viewBox 寬 838，GitHub 顯示寬度約 838px，所以 SVG 字級就是顯示字級（最小 13px）。
       色票：前端 variables.css 的藏青第二版，淺色與深色各一組（深色用 prefers-color-scheme）。 -->
  <title>概念圖：Documentation、Technique、Implementation 三個基礎類別與它們之間的基礎關聯</title>
  <desc>三個基礎類別兩兩之間各有一對方向相反的箭頭，每支箭頭標示該方向的述詞。Technique 與 Implementation 各有兩支指回自己的迴圈箭頭，代表同一類別裡兩筆紀錄之間的關聯。</desc>
  <style>
    .bg { fill: #f6f5f2; }
    .node-doc  { fill: #b34f57; }
    .node-tech { fill: #007d7d; }
    .node-impl { fill: #7264b3; }
    .node-title { font-family: Georgia, "Noto Serif TC", serif; font-weight: 700; font-size: 23px; text-anchor: middle; fill: #ffffff; }
    .node-gloss { font-family: Helvetica, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 14px; text-anchor: middle; fill: #ffffff; }
    .edge { fill: none; stroke: #6d7686; stroke-width: 2.5; }
    .arrow-head { fill: #6d7686; }
    .verb { font-family: "SFMono-Regular", Consolas, Menlo, "Liberation Mono", monospace; font-size: 15px; font-weight: 500; fill: #202839; stroke: #f6f5f2; stroke-width: 5; paint-order: stroke; stroke-linejoin: round; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .legend { font-family: Helvetica, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 13.5px; fill: #3e4758; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1529; }
      .edge { stroke: #8a93a4; }
      .arrow-head { fill: #8a93a4; }
      .verb { fill: #e8edf6; stroke: #0d1529; }
      .legend { fill: #c8ced9; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto">
      <path class="arrow-head" d="M0,0 L10,5 L0,10 z"></path>
    </marker>
  </defs>

  <rect class="bg" width="838" height="650"></rect>

  <g transform="translate(4 0)">

  <!-- ===== 箭頭（畫在方塊底下；每個方向各一支，標那個方向的述詞） ===== -->

  <!-- Documentation → Technique：specs；Technique → Documentation：specifiedBy -->
  <path class="edge" d="M 318 120 L 138 372" marker-end="url(#arrow)"></path>
  <text class="verb end" x="213" y="250">specs</text>
  <path class="edge" d="M 178 372 L 358 120" marker-end="url(#arrow)"></path>
  <text class="verb" x="282" y="250">specifiedBy</text>

  <!-- Documentation → Implementation：documents；Implementation → Documentation：documentedBy -->
  <path class="edge" d="M 512 120 L 692 372" marker-end="url(#arrow)"></path>
  <text class="verb" x="617" y="250">documents</text>
  <path class="edge" d="M 652 372 L 472 120" marker-end="url(#arrow)"></path>
  <text class="verb end" x="548" y="250">documentedBy</text>

  <!-- Implementation → Technique：uses；Technique → Implementation：usedBy -->
  <path class="edge" d="M 570 402 L 260 402" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="415" y="393">uses</text>
  <path class="edge" d="M 260 442 L 570 442" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="415" y="433">usedBy</text>

  <!-- Technique 指向自己：requires／isRequiredBy（同一類別裡兩筆紀錄之間的關聯） -->
  <path class="edge" d="M 105 464 C 105 510, 69 510, 69 464" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="87" y="526">requires</text>
  <path class="edge" d="M 185 464 C 185 510, 221 510, 221 464" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="203" y="526">isRequiredBy</text>

  <!-- Implementation 指向自己：descendantOf／ancestorOf -->
  <path class="edge" d="M 645 464 C 645 510, 609 510, 609 464" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="627" y="526">descendantOf</text>
  <path class="edge" d="M 725 464 C 725 510, 761 510, 761 464" marker-end="url(#arrow)"></path>
  <text class="verb mid" x="743" y="526">ancestorOf</text>

  <!-- ===== 三個基礎類別 ===== -->
  <rect class="node-doc" x="300" y="28" width="230" height="92" rx="14"></rect>
  <text class="node-title" x="415" y="70">Documentation</text>
  <text class="node-gloss" x="415" y="98">文件</text>

  <rect class="node-tech" x="30" y="372" width="230" height="92" rx="14"></rect>
  <text class="node-title" x="145" y="414">Technique</text>
  <text class="node-gloss" x="145" y="442">使用技術</text>

  <rect class="node-impl" x="570" y="372" width="230" height="92" rx="14"></rect>
  <text class="node-title" x="685" y="414">Implementation</text>
  <text class="node-gloss" x="685" y="442">實際執行</text>

  <!-- ===== 圖例 ===== -->
  <line class="edge" x1="30" y1="568" x2="70" y2="568" marker-end="url(#arrow)"></line>
  <text class="legend" x="86" y="573">箭頭從主詞指向受詞，每個方向各一支，標的是那個方向的述詞（例：Implementation uses Technique）</text>

  <path class="edge" d="M 40 590 C 40 606, 60 606, 60 590" marker-end="url(#arrow)"></path>
  <text class="legend" x="86" y="603">指回自己的箭頭：同一個類別裡兩筆紀錄之間的關聯（Documentation 目前沒有這種述詞）</text>

  <text class="legend" x="30" y="632">圖上只畫基礎類別與基礎關聯；子類與其他述詞列在 README 的表格。</text>
  </g>
</svg>
