name: Larastan

# 靜態分析（Larastan，PHPStan 的 Laravel 擴充）：只在 pull request 上跑，只是報告，不擋 PR。
# 設定在根目錄的 phpstan.neon，現有程式碼已經有的問題記在 phpstan-baseline.neon，
# 所以這裡列的都是「這個 PR 新增」的問題。怎麼看、本機怎麼跑：
# docs/conventions/testing.md「靜態分析與覆蓋率報告」。
#
# 怎麼做到不擋 PR：
# - 找到問題（phpstan 以 1 結束）時，分析那一步自己以 0 結束，job 是綠燈；結果寫在 job 的
#   Summary，並在 Files changed 上標成警告註解。
# - phpstan 當掉、輸出讀不出來，或回報不屬於任何檔案的內部錯誤時，job 是紅燈，Summary 寫
#   「沒有產出結果」，不會被當成「沒有問題」。不加 continue-on-error，加了紅燈會變綠燈。
# - 安裝套件、準備環境這些前置步驟沒有加，壞了就是壞了（tests.yml 同樣會壞）。
#
# 不放進 tests.yml 的理由跟 infection.yml 一樣：tests.yml 同時跑 push 與 pull request、
# 有兩個資料庫的矩陣，這個只在 pull request 跑、不需要資料庫，分開以後那邊的觸發條件不用動。
# Larastan 是 composer 的 dev 相依套件，版本跟著 composer.lock。

on:
  pull_request:
    branches: [main, develop]
    # 清單包含 phpstan.neon 的 paths（app、database/factories、database/seeders、routes），再加上會影響結果的 migration 與 config。
    paths:
      - "app/**"
      - "database/factories/**"
      - "database/seeders/**"
      - "routes/**"
      # Larastan 讀 migration 推算 model 屬性、讀 config 判斷型別，只改這兩處也會改變結果。
      - "database/migrations/**"
      - "config/**"
      - "phpstan.neon"
      - "phpstan-baseline.neon"
      - "composer.json"
      - "composer.lock"
      - ".github/workflows/larastan.yml"

permissions:
  contents: read

# 同一個 PR 又推了新 commit 時，取消還在跑的舊那次。
concurrency:
  group: larastan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  larastan:
    name: Larastan (report only)
    # develop -> main 的上線 PR 帶的是一整週已經各自跑過的改動，不再整批重跑。
    if: github.head_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: sqlite3, pdo_sqlite, pgsql, pdo_pgsql, mbstring, bcmath, ctype, fileinfo, tokenizer, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # Larastan 會啟動 Laravel 應用程式來讀 model 與設定，需要 .env。
      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpstan 結束碼：0 = 沒有問題，1 = 有問題，其他 = 自己當掉。
      # 輸出 JSON 再用 jq 整理成註解與 Summary；JSON 讀不出來（當掉、輸出被截斷）就明講沒有結果，
      # 不會被當成「沒有問題」。
      # 註解最多標 50 則（GitHub 每個 job 的上限），Summary 表格最多列 100 列。
      - name: Run Larastan
        id: larastan
        run: |
          mkdir -p build/phpstan
          status=0
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=json \
            > build/phpstan/result.json 2> build/phpstan/stderr.log || status=$?

          # 不屬於任何檔案的錯誤（.errors）是 phpstan 的內部錯誤，這時真正的結果會被丟掉，同樣算沒有結果。
          # 基準檔過期的 ignore.unmatched 會掛在檔案底下，不在 .errors 裡。
          if [ "$status" -gt 1 ] || ! jq -e '.totals and (.errors | length == 0)' build/phpstan/result.json > /dev/null 2>&1; then
            {
              echo "## Larastan：沒有產出結果"
              echo
              echo "phpstan 以 ${status} 結束，輸出不是可讀的 JSON（當掉或被截斷），或有內部錯誤，**這不代表沒有問題**。"
              jq -r '.errors[]? | "- " + .' build/phpstan/result.json 2>/dev/null || true
              echo
              echo '```'
              tail -n 40 build/phpstan/stderr.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat build/phpstan/stderr.log
            exit 1
          fi

          # 攤平成一列一則。訊息裡會帶完整路徑，去掉 checkout 的根目錄再顯示。
          # 沒有問題時 .files 是空陣列、有問題時是物件，to_entries 兩種都吃。
          jq --arg ws "$GITHUB_WORKSPACE/" '
            def clean: split($ws) | join("");
            [ .files | to_entries[] | .key as $file | .value.messages[]
              | { file: ($file | clean), line: (.line // 1), message: (.message | clean), identifier: (.identifier // "") } ]
          ' build/phpstan/result.json > build/phpstan/findings.json

          # 基準檔裡的項目對不上現況（問題少了、或次數變少）時，phpstan 會報 ignore.* 的錯誤。
          # 那代表「基準檔該重產了」（通常是這個 PR 修掉了問題），不是新增的問題，分開算。
          found=$(jq '[.[] | select(.identifier | startswith("ignore.") | not)] | length' build/phpstan/findings.json)
          stale=$(jq '[.[] | select(.identifier | startswith("ignore."))] | length' build/phpstan/findings.json)
          baseline=$(awk '/^[[:space:]]+count:/ { total += $2 } END { print total + 0 }' phpstan-baseline.neon)

          jq -r '[ .[] | select(.identifier | startswith("ignore.") | not)
                   | "::warning file=\(.file),line=\(.line),title=Larastan::\(.message | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))" ]
                 | .[:50][]' build/phpstan/findings.json

          {
            echo "## Larastan（level 5，只報告、不擋 PR）"
            echo
            echo "- 新增的問題：**${found}** 則"
            echo "- 基準檔 \`phpstan-baseline.neon\` 裡既有、還沒處理的問題：${baseline} 則（不算在上面）"
            if [ "$stale" -gt 0 ]; then
              echo "- 基準檔有 ${stale} 項對不上現況（通常是這個 PR 修掉了問題），用 \`vendor/bin/phpstan analyse --generate-baseline phpstan-baseline.neon\` 重產基準檔。"
            fi
            if [ "$found" -gt 0 ]; then
              echo
              echo "| 位置 | 問題 |"
              echo "| --- | --- |"
              jq -r '[ .[] | select(.identifier | startswith("ignore.") | not)
                       | "| `\(.file):\(.line)` | \(.message | gsub("\n"; " ") | gsub("\\|"; "\\|")) (`\(.identifier | if . == "" then "-" else . end)`) |" ]
                     | .[:100][]' build/phpstan/findings.json
              if [ "$found" -gt 100 ]; then
                echo
                echo "只列前 100 則，完整清單在 job 的 log 與 \`larastan\` artifact。"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # log 裡印完整清單（含基準檔過期的項目）。
          # 有問題（結束碼 1）是正常的報告結果，這一步以 0 結束；只有當掉才會紅叉。
          jq -r '.[] | "\(.file):\(.line) \(.message)"' build/phpstan/findings.json

      - name: Upload Larastan result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: larastan
          path: build/phpstan/
          if-no-files-found: ignore
          retention-days: 14
