name: Tests

# Runs the PHPUnit/Pest suite (`composer test`, i.e. `php artisan test`) on
# every push to main/develop and every pull request targeting main/develop,
# so regressions are caught before merge instead of relying on someone
# running the suite by hand afterwards. Feature PRs target `develop` (the
# integration branch); `develop` -> `main` is the release PR, and only
# `main` deploys (see CLAUDE.md「分支策略」).
#
# Runs against BOTH SQLite (local dev's default, `DB_CONNECTION=sqlite` in
# `.env.example`) AND Postgres (production's actual `DB_CONNECTION=pgsql`,
# per `.env.production.example`/`docs/deployment-gcp.md`) — added
# 2026-09-09 after a real SQLite-only-green, Postgres-red bug slipped past
# this workflow (`ScopeSeeder`/`relationCRUDTest.php` had hardcoded scope/
# relation id literals that only happened to work because SQLite's
# RefreshDatabase-per-test rowid counter resets on transaction rollback;
# Postgres sequences don't, so the same code broke there — see the PR that
# fixed it). Testing only the dev-convenience database and never the one
# actually deployed to is exactly the gap that let that bug through
# silently green.
#
# Also checks code style with `pint --test` (Laravel preset, PSR-12), once
# per run on the SQLite leg.
#
# The API docs (`/docs/api`, `/docs/api.json`) are only served when
# APP_ENV=local (`config/scramble.php`), so the SQLite leg also exports the
# OpenAPI document with `scramble:export` and uploads it as the `openapi`
# artifact of the run.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: my_dev_grid
          POSTGRES_USER: my_dev_grid_app
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U my_dev_grid_app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: sqlite3, pdo_sqlite, pgsql, pdo_pgsql, mbstring, bcmath, ctype, fileinfo, tokenizer, xml
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      # 相依套件有已知漏洞就讓 CI 失敗（只跑一次，不用兩個資料庫都跑）。
      # 停止維護的套件只回報、不擋。
      - name: Audit Composer dependencies
        if: matrix.db == 'sqlite'
        run: composer audit --locked --no-interaction --abandoned=report

      # 程式碼風格不符 Pint（Laravel 預設，PSR-12）就讓 CI 失敗；只跑一次。
      - name: Check code style (Pint)
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

      - name: Prepare environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare SQLite database
        if: matrix.db == 'sqlite'
        run: touch database/database.sqlite

      - name: Run tests (SQLite)
        if: matrix.db == 'sqlite'
        run: composer test

      # 匯出 OpenAPI 文件（正式環境不提供 /docs/api，要看文件就下載這個 artifact）；只跑一次。
      # 先 migrate：Scramble 讀資料表欄位推斷 model 的屬性，沒有資料表會少欄位資訊。
      # route:cache 跟正式環境一樣，路由寫成 closure 時 #[Endpoint] 會讀不到（docs/conventions/api.md）。
      - name: Export OpenAPI document
        if: matrix.db == 'sqlite'
        run: |
          php artisan migrate --force --no-interaction
          php artisan route:cache
          php artisan scramble:export
          php artisan route:clear

      - name: Upload OpenAPI document
        if: matrix.db == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: api.json
          if-no-files-found: error

      - name: Run tests (Postgres)
        if: matrix.db == 'pgsql'
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: my_dev_grid
          DB_USERNAME: my_dev_grid_app
          DB_PASSWORD: testing
