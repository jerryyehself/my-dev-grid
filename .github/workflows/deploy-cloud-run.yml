name: Deploy to Cloud Run

# Builds the Dockerfile, pushes it to Artifact Registry, runs pending
# migrations and then the reference-data seeder (ReferenceDataSeeder) as
# Cloud Run Jobs, then deploys the image to the Cloud Run service. Authenticates to Google Cloud via Workload Identity Federation —
# no service-account JSON key is stored in GitHub.
#
# 新 revision 先不接流量（#107、D-131）：`--no-traffic --tag` 部署，對 tag 專用網址
# 跑自動檢查，通過才把流量切過去；檢查沒過，job 失敗、流量留在原本的 revision。
# 回滾方式見 docs/zero-downtime-migrations.md §6.1。
#
# This workflow does nothing until the repository variables below are set
# (the job-level `if` skips it cleanly instead of failing red), and it can't
# succeed until the GCP-side setup in docs/deployment-gcp.md is done: the
# WIF pool/provider, the deployer service account and its IAM bindings, the
# Artifact Registry repo, the Cloud SQL instance, and the Secret Manager
# secrets all have to exist first.
#
# Required repository variables (Settings > Secrets and variables > Actions
# > Variables) — see docs/deployment-gcp.md for how to get each value:
#   GCP_PROJECT_ID                 GCP project ID
#   GCP_REGION                     e.g. asia-east1
#   GCP_WORKLOAD_IDENTITY_PROVIDER full WIF provider resource name
#   GCP_DEPLOYER_SERVICE_ACCOUNT   email of the SA GitHub Actions impersonates
#   GCP_ARTIFACT_REGISTRY_REPO     Artifact Registry Docker repo name
#   CLOUD_RUN_SERVICE              Cloud Run service name
#   CLOUD_SQL_CONNECTION_NAME      PROJECT_ID:REGION:INSTANCE
#   DB_DATABASE                    Postgres database name
#   DB_USERNAME                    Postgres role used by the app
#   CLOUD_RUN_SERVICE_ACCOUNT      runtime service account the Cloud Run
#                                   service/job run as (needs
#                                   roles/secretmanager.secretAccessor +
#                                   roles/cloudsql.client) — deliberately not
#                                   the deployer SA above, and not the
#                                   project's default compute SA
#   SANCTUM_STATEFUL_DOMAINS       the production host serving Triple 後台
#                                   (Sanctum SPA session cookies)
#   GOOGLE_CLIENT_ID               Google OAuth app client id
#   GOOGLE_REDIRECT_URI            Google OAuth app redirect URI
#   LINE_CLIENT_ID                 LINE Login channel id
#   LINE_REDIRECT_URI              LINE Login channel redirect URI
#   APP_URL                        這個 Cloud Run 服務自己的網址
#   FRONTEND_URL                   前端（Cloudflare）網址：CORS 只放行它，
#                                   OAuth 登入完成也導回它；沒設會退回
#                                   http://localhost:5173，前端全部被擋
# Optional:
#   CLOUD_RUN_MIGRATE_JOB          Cloud Run Job name that runs
#                                   `php artisan migrate --force` against
#                                   this image; the migration step is
#                                   skipped when this isn't set. 跑預設資料
#                                   seeder 的 Job 叫 `<這個名稱>-seed`，自動建立，
#                                   沒設這個變數也一起跳過
#   CLOUD_RUN_SYNC_JOB             跑 `php artisan github:sync-repos`（每天的
#                                   GitHub 同步）的 Cloud Run Job 名稱。這個
#                                   workflow 只負責讓 Job 跟服務用同一個映像檔；
#                                   每天觸發它的是手動設一次的 Cloud Scheduler
#                                   （docs/deployment-gcp.md 第 10 步）。沒設就跳過
#
# No repository *secrets* are needed — app secrets (APP_KEY, DB_PASSWORD,
# GITHUB_TOKEN, GOOGLE_CLIENT_SECRET, LINE_CLIENT_SECRET) live in Secret
# Manager and are wired in via --set-secrets/secrets below, never copied
# through GitHub.

on:
  push:
    branches: [main]
    # 只改文件的 push 不部署（D-107）：例如 CHANGELOG 寫上上線日期，映像檔內容不變，
    # 重新部署只是白跑一次 build＋migration。
    # 刻意只寫根目錄的 `*.md`、不寫 `**.md`：database/seeders/fixtures/articles/*.md
    # 是 ArticleSeeder 讀的資料，會打包進映像檔，改了它要部署才能在正式環境重跑 seeder。
    # 這兩個 pattern 跟 .dockerignore 排除的 `*.md`、`docs` 一致——不進映像檔的才跳過。
    # 一次 push 裡只要有任何一個檔案不符合這兩個 pattern，就照常部署。
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch: {}
  # 每週重建、重新部署一次：Dockerfile 用的是浮動 tag（`php:8.4-fpm-alpine`、
  # `node:24-alpine`），只有重建才會拉到 PHP／alpine 的安全修補。程式碼沒改時，
  # 不靠這個排程，正式環境就會一直停在上次部署時的映像檔。
  # 時間是週二 02:23 UTC（台灣 10:23），分鐘數刻意避開整點。
  # GitHub 會在 repo 60 天沒有活動時停用排程，到時要手動重新啟用。
  schedule:
    - cron: '23 2 * * 2'

# 同一時間只跑一個部署（#81）。2026-10-02 #77～#79 幾乎同時合併，三個部署同時跑，
# #79 的 `gcloud run deploy` 撞到 Cloud Run 的版本衝突（ABORTED: Conflict）而失敗；
# migration Job 同時跑兩次也不安全。
# - cancel-in-progress: false：已經在跑的部署不中斷（中途取消可能停在 migration 跑完、
#   新版還沒上線的狀態）。
# - GitHub 對同一個 group 最多保留一個「排隊中」的 run：連續合併三個時，第二個會被
#   第三個取代、不會執行。這是預期的：第三個 commit 已經包含第二個的內容（含 migration），
#   部署最新的就好。
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}

jobs:
  deploy:
    name: Build, push, migrate, deploy
    runs-on: ubuntu-latest
    # Skip cleanly (no red X) until the GCP-side setup is done and these
    # variables are populated, per docs/deployment-gcp.md.
    if: vars.GCP_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    # url 讓 repo 首頁右側的 Deployments 直接連到正式環境的服務網址。
    # 用切流量那步查到的服務網址，不用 deploy 步驟的 output：帶 tag 部署時，
    # deploy-cloudrun 的 url output 是 tag 專用網址，切完流量就移除了。
    environment:
      name: production
      url: ${{ steps.switch.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        # --pull：一定重新拉基底映像檔，不用 runner 上可能殘留的舊版。
        run: docker build --pull -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Run database migrations
        if: vars.CLOUD_RUN_MIGRATE_JOB != ''
        # `jobs deploy` creates the Job on its first run and updates it in
        # place afterwards, so there's nothing to set up by hand beyond
        # picking a name for CLOUD_RUN_MIGRATE_JOB.
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --command=php \
            --args=artisan,migrate,--force \
            --service-account="${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="APP_ENV=production,LOG_CHANNEL=cloud_run,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_CONNECTION_NAME }},DB_PORT=5432,DB_DATABASE=${{ vars.DB_DATABASE }},DB_USERNAME=${{ vars.DB_USERNAME }}" \
            --set-secrets="APP_KEY=APP_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest" \
            --max-retries=0 \
            --task-timeout=600
          gcloud run jobs execute "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" \
            --region="${{ vars.GCP_REGION }}" \
            --wait

      # 預設資料（分類、述詞）只放在 seeder：migration 跑完接著跑 ReferenceDataSeeder，
      # 新加的預設資料跟著這次部署進正式環境，不用另外寫 migration（docs/conventions/data.md）。
      # - 跟 migration 一樣用 Cloud Run Job＋`--wait`，Job 名稱是 migration Job 加 `-seed`，
      #   第一次部署時由 `jobs deploy` 自動建立。沒設 CLOUD_RUN_MIGRATE_JOB 就跟 migration 一起跳過。
      # - seeder 可以重跑：已經存在的不更新、後台刪掉的不建回來；整串在一個 transaction 裡，
      #   失敗就整個退回。
      # - 這步失敗，後面的步驟都不會跑：新 revision 不會部署，流量留在原本的 revision。
      #   跟 migration 一樣，這時舊版程式已經在讀新加的預設資料，所以預設資料也只能新增、
      #   要讓舊版程式讀得懂。
      - name: Seed reference data
        if: vars.CLOUD_RUN_MIGRATE_JOB != ''
        env:
          SEED_JOB: ${{ vars.CLOUD_RUN_MIGRATE_JOB }}-seed
        run: |
          gcloud run jobs deploy "$SEED_JOB" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --command=php \
            --args=artisan,db:seed,--class=ReferenceDataSeeder,--force \
            --service-account="${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="APP_ENV=production,LOG_CHANNEL=cloud_run,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_CONNECTION_NAME }},DB_PORT=5432,DB_DATABASE=${{ vars.DB_DATABASE }},DB_USERNAME=${{ vars.DB_USERNAME }}" \
            --set-secrets="APP_KEY=APP_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest" \
            --max-retries=0 \
            --task-timeout=300
          gcloud run jobs execute "$SEED_JOB" \
            --region="${{ vars.GCP_REGION }}" \
            --wait

      # tag 每次執行都不同（含 re-run 的 attempt），不會撞到上一次沒清掉的 tag。
      # `--no-traffic` 不能用在建立新服務（gcloud 會報「--no-traffic not supported
      # when creating a new service」），所以先查服務在不在：第一次部署（docs/deployment-gcp.md
      # 第 8 步）照常直接接流量，那時候本來就沒有舊版可以保護，但下面的檢查一樣會跑。
      # 用 `services list` 比對名稱而不是 `describe`：describe 失敗（權限、網路）會被誤判成
      # 「服務不存在」，結果新版不經檢查就接流量；list 出錯會讓這步直接失敗。
      - name: Prepare candidate tag
        id: prep
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: run-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          names="$(gcloud run services list --region="$REGION" --format='value(metadata.name)')"
          if grep -qxF -- "$SERVICE" <<<"$names"; then
            exists=true
          else
            exists=false
            echo "::notice::服務 $SERVICE 還不存在，這次是第一次部署，新 revision 會直接接流量"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "service_exists=$exists" >> "$GITHUB_OUTPUT"

      # 新 revision 上線但不接流量，只能從 tag 專用網址（https://<tag>---<服務網址>）打到。
      # deploy-cloudrun 會把 `tag`／`no_traffic` 原樣轉成 `gcloud run deploy --tag --no-traffic`；
      # env_vars／secrets 照舊用 action 預設的 merge（--update-env-vars／--update-secrets）。
      - name: Deploy new revision (no traffic)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          tag: ${{ steps.prep.outputs.tag }}
          no_traffic: ${{ steps.prep.outputs.service_exists }}
          env_vars: |
            APP_NAME=my-dev-grid
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${{ vars.APP_URL }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            LOG_CHANNEL=cloud_run
            LOG_LEVEL=info
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            DB_CONNECTION=pgsql
            DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_CONNECTION_NAME }}
            DB_PORT=5432
            DB_DATABASE=${{ vars.DB_DATABASE }}
            DB_USERNAME=${{ vars.DB_USERNAME }}
            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            MAIL_MAILER=log
            SANCTUM_STATEFUL_DOMAINS=${{ vars.SANCTUM_STATEFUL_DOMAINS }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
            LINE_CLIENT_ID=${{ vars.LINE_CLIENT_ID }}
            LINE_REDIRECT_URI=${{ vars.LINE_REDIRECT_URI }}
          secrets: |
            APP_KEY=APP_KEY:latest
            DB_PASSWORD=DB_PASSWORD:latest
            GITHUB_TOKEN=GITHUB_TOKEN:latest
            GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest
            LINE_CLIENT_SECRET=LINE_CLIENT_SECRET:latest
          flags: >-
            --add-cloudsql-instances=${{ vars.CLOUD_SQL_CONNECTION_NAME }}
            --allow-unauthenticated
            --service-account=${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1

      # 從服務的 status.traffic 找出這個 tag 對到的 revision 和網址，
      # 不依賴 deploy-cloudrun 的 output 格式。
      - name: Resolve candidate revision
        id: candidate
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          svc="$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json)"
          revision="$(jq -r --arg t "$TAG" '.status.traffic[]? | select(.tag == $t) | .revisionName' <<<"$svc")"
          url="$(jq -r --arg t "$TAG" '.status.traffic[]? | select(.tag == $t) | .url' <<<"$svc")"
          if [ -z "$revision" ] || [ -z "$url" ] || [ "$revision" = null ] || [ "$url" = null ]; then
            echo "::error::找不到 tag $TAG 對應的 revision"
            jq '.status.traffic' <<<"$svc"
            exit 1
          fi
          echo "新 revision：$revision"
          echo "tag 網址：$url"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 對 tag 網址做自動檢查，全部通過才切流量。
      # - /up：Laravel 健康檢查，要經過 php-fpm 才回得了 200。服務設 --min-instances=0，
      #   而且 nginx 會比 php-fpm 先開始聽（#91），第一個請求可能是 502，所以碰到
      #   000（連不上／逾時）、502、503、504 會每 5 秒重試，最多 12 次。
      # - /api/scopes：會查資料庫，確認新程式跑在剛 migrate 完的結構上、Cloud SQL 連得到。
      # - /api/<不存在的路徑>：404，確認路由與錯誤處理正常（不是 500）。
      # - 每個回應都要帶 X-Request-Id（AssignRequestId，#100）。
      - name: Probe candidate revision
        id: probe
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          work="$(mktemp -d)"
          failures=0

          # probe <路徑> <預期狀態碼> <最多嘗試次數>
          probe() {
            local path="$1" want="$2" attempts="$3" i tries=0 code=000
            for ((i = 1; i <= attempts; i++)); do
              tries=$i
              rm -f "$work/headers" "$work/body"
              code="$(curl -sS --max-time 15 -H 'Accept: application/json' \
                -D "$work/headers" -o "$work/body" -w '%{http_code}' \
                "$CANDIDATE_URL$path")" || code=000
              case "$code" in
                000|502|503|504) ;;
                *) break ;;
              esac
              if [ "$i" -lt "$attempts" ]; then sleep 5; fi
            done

            local result=ok note="第 $tries 次"
            if [ "$code" != "$want" ]; then
              result=fail
              note="實際 $code（第 $tries 次）"
            elif ! grep -qi '^x-request-id:' "$work/headers" 2>/dev/null; then
              result=fail
              note="回應沒有 X-Request-Id"
            fi
            echo "$result  GET $path → $want  $note"
            echo "| GET \`$path\` → $want | $result | $note |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" = fail ]; then
              echo "::error::GET $path：$note"
              head -c 2000 "$work/body" 2>/dev/null || true
              echo
              failures=$((failures + 1))
            fi
          }

          {
            echo "### 新 revision 檢查（$REVISION）"
            echo
            echo "| 檢查 | 結果 | 說明 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          probe /up 200 12
          probe /api/scopes 200 3
          probe /api/__deploy-probe-not-found 404 3

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures 項檢查沒過，不切流量，正式環境維持原本的 revision"
            exit 1
          fi

      # 檢查通過，把 100% 流量切到 LATEST，同一個指令把 tag 移掉
      # （gcloud 會先改 tag 再改流量）。切完之後服務回到「LATEST 100%」的一般狀態。
      # 切之前先確認 LATEST（latestReadyRevisionName）就是剛剛檢查過的 revision：
      # 這段時間如果有人在 workflow 外面手動 deploy，--to-latest 會切到沒檢查過的版本。
      - name: Switch traffic to new revision
        id: switch
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ steps.prep.outputs.tag }}
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          latest="$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          if [ "$latest" != "$REVISION" ]; then
            echo "::error::LATEST 是 $latest，不是剛檢查過的 $REVISION，不切流量"
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --to-latest \
            --remove-tags="$TAG"
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "流量已切到 $REVISION（$url）" >> "$GITHUB_STEP_SUMMARY"

      # 每天的 GitHub 同步：Cloud Run 沒有 cron，routes/console.php 的 Laravel 排程在這裡不會跑，
      # 改由 Cloud Scheduler 每天觸發這個 Job（設定見 docs/deployment-gcp.md 第 10 步）。
      # 這一步只負責讓 Job 跟服務用同一個映像檔，不在部署時執行同步——
      # 部署只補程式附帶的預設資料（上面的 seeder），不順便抓外部資料，同步的時間由 Cloud Scheduler 決定。
      # 放在切流量之後：這步失敗不會擋到服務上線，Job 只是還停在上一個映像檔；
      # 新 revision 沒通過檢查時這步不會跑，Job 跟接流量的舊版留在同一個映像檔。
      - name: Update GitHub sync job
        if: vars.CLOUD_RUN_SYNC_JOB != ''
        run: |
          gcloud run jobs deploy "${{ vars.CLOUD_RUN_SYNC_JOB }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --command=php \
            --args=artisan,github:sync-repos \
            --service-account="${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-cloudsql-instances="${{ vars.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="APP_ENV=production,LOG_CHANNEL=cloud_run,DB_CONNECTION=pgsql,DB_HOST=/cloudsql/${{ vars.CLOUD_SQL_CONNECTION_NAME }},DB_PORT=5432,DB_DATABASE=${{ vars.DB_DATABASE }},DB_USERNAME=${{ vars.DB_USERNAME }}" \
            --set-secrets="APP_KEY=APP_KEY:latest,DB_PASSWORD=DB_PASSWORD:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest" \
            --max-retries=1 \
            --task-timeout=300

      # 前面任何一步失敗或被取消時，把這次的 tag 移掉，沒通過檢查的 revision 就不再有
      # 公開的專用網址。只動 tag，不動流量：流量還在原本的 revision 上。
      # revision 本身留著（0% 流量，不會被打到），之後要看日誌可以用它的名字查。
      # 注意：沒通過檢查的 revision 仍然是服務的 LATEST，不要手動跑 `--to-latest`，
      # 退版或恢復一律用 `--to-revisions`（docs/zero-downtime-migrations.md §6.1）。
      - name: Remove candidate tag after failure
        if: (failure() || cancelled()) && steps.prep.outputs.tag != ''
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          TAG: ${{ steps.prep.outputs.tag }}
          REVISION: ${{ steps.candidate.outputs.revision }}
          SWITCH_OUTCOME: ${{ steps.switch.outcome }}
          SERVICE_EXISTED: ${{ steps.prep.outputs.service_exists }}
        run: |
          svc="$(gcloud run services describe "$SERVICE" --region="$REGION" --format=json)" || {
            echo "::warning::查不到服務 $SERVICE，略過移除 tag"
            exit 0
          }
          if jq -e --arg t "$TAG" '[.spec.traffic[]? | select(.tag == $t)] | length > 0' <<<"$svc" >/dev/null; then
            gcloud run services update-traffic "$SERVICE" --region="$REGION" --remove-tags="$TAG"
          else
            echo "tag $TAG 不存在（部署前就失敗，或已經在切流量時移除），不用處理"
          fi
          echo "目前的流量分配："
          gcloud run services describe "$SERVICE" --region="$REGION" --format=json | jq '.status.traffic'
          # 第一次部署（服務原本不存在）沒有 --no-traffic，新 revision 一開始就接流量，不適用這句。
          if [ -n "$REVISION" ] && [ "$SWITCH_OUTCOME" != success ] && [ "$SERVICE_EXISTED" = true ]; then
            echo "新 revision $REVISION 沒有接到流量，正式環境維持原本的 revision" >> "$GITHUB_STEP_SUMMARY"
          fi
